<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Block CMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="public-page">

<div class="public-topbar">
  <span class="site-title" id="site-title">Site</span>
  <a href="dashboard.html" class="btn btn-small">Back to admin</a>
</div>
<div class="public-notice" id="draft-notice" style="display:none;">
  This content is a draft and is not publicly published yet.
</div>

<div class="public-content" id="content">
  <p style="color:var(--text-secondary);">Loading…</p>
</div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/router.js"></script>
<script src="js/blocks.js"></script>
<script src="js/preview.js"></script>
<script src="js/categories.js"></script>
<script src="js/pages.js"></script>
<script src="js/posts.js"></script>
<script>
  const siteSettings = Storage.getSettings();
  document.getElementById('site-title').textContent = siteSettings.siteTitle || 'My Site';

  const type = Router.param('type') === 'post' ? 'post' : 'page';
  const slug = Router.param('slug') || '';
  const Model = type === 'post' ? Posts : Pages;
  const item = Model.getBySlug(slug);

  const contentEl = document.getElementById('content');

  if (!item) {
    contentEl.innerHTML = `
      <div class="empty-state">
        <h3>Not found</h3>
        <p>No ${type} exists with the slug “${UI.escapeHtml(slug)}”.</p>
      </div>`;
  } else {
    if (item.status !== 'published') {
      document.getElementById('draft-notice').style.display = 'block';
    }
    Preview.renderInto(contentEl, item, {
      author: type === 'post' ? item.author : null,
      date: type === 'post' ? item.publishDate : null,
      categories: type === 'post' ? Categories.namesFor(item.categoryIds) : []
    });
  }
</script>
</body>
</html>
