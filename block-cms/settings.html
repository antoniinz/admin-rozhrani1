<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Block CMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Settings</h1>
        <p class="page-subtitle">Account and site preferences, stored only in this browser.</p>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="section-title">Site settings</div>
        <form id="site-form">
          <div class="field">
            <label for="site-title">Site title</label>
            <input type="text" id="site-title">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="site-tagline">Tagline</label>
            <input type="text" id="site-tagline">
          </div>
          <div style="margin-top:18px;">
            <button type="submit" class="btn btn-primary">Save site settings</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="section-title">Account</div>
        <form id="account-form">
          <div class="field">
            <label for="display-name">Display name</label>
            <input type="text" id="display-name">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Username</label>
            <input type="text" id="username-readonly" disabled>
          </div>
          <div style="margin-top:18px;">
            <button type="submit" class="btn btn-secondary">Save name</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card" style="margin-top:20px; max-width:520px;">
      <div class="section-title">Change password</div>
      <form id="password-form">
        <div class="field">
          <label for="current-password">Current password</label>
          <input type="password" id="current-password" autocomplete="current-password">
        </div>
        <div class="two-col">
          <div class="field" style="margin-bottom:0;">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" autocomplete="new-password">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" autocomplete="new-password">
          </div>
        </div>
        <div style="margin-top:18px;">
          <button type="submit" class="btn btn-primary">Update password</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/router.js"></script>
<script src="js/settings.js"></script>
<script>
  Router.requireAuth();
  UI.renderSidebar('settings');

  const user = Auth.currentUser();
  const settings = Settings.get();

  document.getElementById('site-title').value = settings.siteTitle || '';
  document.getElementById('site-tagline').value = settings.tagline || '';
  document.getElementById('display-name').value = user.displayName || '';
  document.getElementById('username-readonly').value = user.username || '';

  document.getElementById('site-form').addEventListener('submit', (e) => {
    e.preventDefault();
    Settings.update({
      siteTitle: document.getElementById('site-title').value.trim() || 'My Site',
      tagline: document.getElementById('site-tagline').value.trim()
    });
    UI.toast('Site settings saved');
    UI.renderSidebar('settings');
  });

  document.getElementById('account-form').addEventListener('submit', (e) => {
    e.preventDefault();
    try {
      Auth.updateDisplayName(document.getElementById('display-name').value);
      UI.toast('Display name saved');
      UI.renderSidebar('settings');
    } catch (err) {
      UI.toast(err.message, 'error');
    }
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const current = document.getElementById('current-password').value;
    const next = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if (next !== confirm) {
      UI.toast('New passwords do not match.', 'error');
      return;
    }
    try {
      await Auth.changePassword(current, next);
      UI.toast('Password updated');
      e.target.reset();
    } catch (err) {
      UI.toast(err.message, 'error');
    }
  });
</script>
</body>
</html>
